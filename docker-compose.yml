services:
  mysql:
    image: mysql:8.0
    container_name: etlguard-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_local_only
      MYSQL_DATABASE: etlguard
      MYSQL_USER: etlguard
      MYSQL_PASSWORD: etlguard_local_only
    ports:
      - "127.0.0.1:3307:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - mysql-data:/var/lib/mysql
volumes:
  mysql-data:
