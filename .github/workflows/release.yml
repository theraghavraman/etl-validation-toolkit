name: Publish verified GitHub release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
  matrix:
    uses: ./.github/workflows/mysql8-staging-gate.yml
  github-release:
    needs: [verify, matrix]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check tag matches the package version
        run: |
          python - <<'PY'
          import os, tomllib
          with open("pyproject.toml", "rb") as stream:
              version = tomllib.load(stream)["project"]["version"]
          assert os.environ["GITHUB_REF_NAME"] == "v" + version
          PY
      - name: Build and exercise release downloads
        run: |
          python -m pip install --upgrade build
          python -m build
          python scripts/verify_distribution.py
      - name: Publish verified release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
