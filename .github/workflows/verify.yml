name: Reusable product verification

on:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    name: Ruff, mypy, pytest, MySQL 8
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_local_only
          MYSQL_DATABASE: etlguard
          MYSQL_USER: etlguard
          MYSQL_PASSWORD: etlguard_local_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot_local_only --silent"
          --health-interval=5s --health-timeout=3s --health-retries=25
    env:
      ETLGUARD_TEST_MYSQL_URL: mysql+pymysql://etlguard:etlguard_local_only@127.0.0.1:3306/etlguard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package with development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Mypy types
        run: mypy src/etlguard
      - name: Unit, property, mocked API, CLI and real MySQL 8 tests
        run: >-
          pytest -q --cov=etlguard --cov-branch
          --cov-report=term-missing --cov-report=xml
          --cov-fail-under=85
      - name: Build and verify installable distributions
        run: |
          python -m build
          python scripts/verify_distribution.py
      - name: Generate live coverage badge
        run: |
          python -m coverage json -o coverage-summary.json
          python scripts/build_coverage_badge.py coverage-summary.json demo/coverage.json
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: coverage-report
          path: |
            coverage.xml
            demo/coverage.json
          retention-days: 14

  browser:
    name: Browser acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[browser]"
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/build_demo_bundle.py
      - run: python scripts/verify_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-acceptance
          path: verification-evidence/browser/

