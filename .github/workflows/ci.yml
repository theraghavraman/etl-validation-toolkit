name: CI and GitHub Pages demo

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  pages:
    name: Publish browser demo
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_PUBLIC_DEMO_PAGES == 'true'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Bundle production Python validation modules for Pyodide
        run: python scripts/build_demo_bundle.py
      - uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: badge-artifact
      - name: Put current coverage endpoint in deployed website
        run: cp badge-artifact/demo/coverage.json demo/coverage.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo
      - id: deployment
        uses: actions/deploy-pages@v4
