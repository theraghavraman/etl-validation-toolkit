name: CI and GitHub Pages demo

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Ruff, mypy, pytest, MySQL 8
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_local_only
          MYSQL_DATABASE: etlguard
          MYSQL_USER: etlguard
          MYSQL_PASSWORD: etlguard_local_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot_local_only --silent"
          --health-interval=5s --health-timeout=3s --health-retries=25
    env:
      ETLGUARD_TEST_MYSQL_URL: mysql+pymysql://etlguard:etlguard_local_only@127.0.0.1:3306/etlguard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package with development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Mypy types
        run: mypy src/etlguard
      - name: Unit, property, mocked API, CLI and real MySQL 8 tests
        run: >-
          pytest -q --cov=etlguard --cov-branch
          --cov-report=term-missing --cov-report=xml
          --cov-fail-under=85
      - name: Generate live coverage badge
        run: |
          python -m coverage json -o coverage-summary.json
          python scripts/build_coverage_badge.py coverage-summary.json demo/coverage.json
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: coverage-report
          path: |
            coverage.xml
            demo/coverage.json
          retention-days: 14

  pages:
    name: Publish browser demo
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_PUBLIC_DEMO_PAGES == 'true'
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Bundle production Python validation modules for Pyodide
        run: python scripts/build_demo_bundle.py
      - uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: badge-artifact
      - name: Put current coverage endpoint in deployed website
        run: cp badge-artifact/demo/coverage.json demo/coverage.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo
      - id: deployment
        uses: actions/deploy-pages@v4
