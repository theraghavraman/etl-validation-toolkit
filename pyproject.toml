[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "etl-validation-toolkit"
version = "0.1.2"
description = "Typed, config-driven ETL data quality gates and MySQL load reconciliation."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "ETL Guard Contributors"}]
keywords = ["etl", "data-quality", "validation", "pydantic", "mysql", "scd2"]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Intended Audience :: Developers"]
dependencies = [
  "pydantic>=2.10,<3",
  "pandas>=2.2,<3",
  "numpy>=1.26,<2.4",
  "openpyxl>=3.1,<4",
  "httpx>=0.27,<1",
  "SQLAlchemy>=2.0,<3",
  "PyMySQL>=1.1,<2",
  "typer>=0.12,<1",
  "PyYAML>=6,<7",
  "rich>=13,<16",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "hypothesis>=6,<7", "respx>=0.21,<1", "ruff>=0.11,<1", "mypy>=1.15,<2", "pandas-stubs>=2.2,<3", "types-PyYAML>=6", "build>=1.2"]

[project.scripts]
etlguard = "etlguard.cli:app"

[project.urls]
Repository = "https://github.com/theraghavraman/etl-validation-toolkit"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"etlguard.examples" = ["pipelines/*.yaml", "data/*.csv", "data/*.xlsx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a real MySQL 8 server"]
addopts = "-ra"

[tool.coverage.run]
source = ["etlguard"]
branch = true
omit = ["src/etlguard/examples/*", "src/etlguard/browser_demo.py"]

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
ignore_missing_imports = true
exclude = ["tests/", "scripts/"]
