# Disposable LOCAL test database only. Never attach real production volumes or data.
services:
  mysql8-staging:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root_for_disposable_tests_only
      MYSQL_DATABASE: etlguard_ci
      MYSQL_USER: etlguard_ci
      MYSQL_PASSWORD: etlguard_ci_local_only
    ports:
      - "127.0.0.1:3308:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s
    volumes:
      - ./scripts/mysql8_init_shadow.sql:/docker-entrypoint-initdb.d/10-shadow.sql:ro
    tmpfs:
      - /var/lib/mysql:rw,size=512m
